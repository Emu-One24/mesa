[binaries]
c = 'aarch64-linux-android29-clang'
cpp = 'aarch64-linux-android29-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[built-in options]
c_args = ['-fPIC', '-DANDROID']
cpp_args = ['-fPIC', '-DANDROID']
c_link_args = ['-fPIC']
cpp_link_args = ['-fPIC']

[properties]
sys_root = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot'
android_api_level = '29'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

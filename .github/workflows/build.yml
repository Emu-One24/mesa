name: Build libvulkan_wrapper

on:
  push:
    branches: [ wrapper-25 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrapper-25

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build python3 python3-mako \
            libexpat1-dev pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libdrm-dev
          pip3 install meson

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Setup libdrm for aarch64
        run: |
          SYSROOT=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot

          # Copy headers
          sudo cp /usr/include/xf86drm.h $SYSROOT/usr/include/
          sudo cp /usr/include/xf86drmMode.h $SYSROOT/usr/include/
          sudo cp -r /usr/include/libdrm $SYSROOT/usr/include/
          sudo cp /usr/include/libdrm/drm.h $SYSROOT/usr/include/
          sudo cp /usr/include/libdrm/drm_mode.h $SYSROOT/usr/include/

          # Build aarch64 stub libdrm.so with all required symbols
          cat > /tmp/drm_stub.c << 'STUBEOF'
#include <stddef.h>
#include <stdint.h>
int drmIoctl(int fd, unsigned long r, void *a){return -1;}
int drmSyncobjFDToHandle(int fd, int sf, uint32_t *h){return -1;}
int drmSyncobjDestroy(int fd, uint32_t h){return -1;}
int drmSyncobjCreate(int fd, uint32_t f, uint32_t *h){return -1;}
int drmSyncobjTransfer(int fd, uint32_t dh, uint64_t dp, uint32_t sh, uint64_t sp, uint32_t f){return -1;}
int drmSyncobjExportSyncFile(int fd, uint32_t h, int *sf){return -1;}
int drmGetDevice2(int fd, uint32_t f, void **d){return -1;}
int drmDevicesEqual(void *a, void *b){return 0;}
int drmSyncobjQuery(int fd, uint32_t *h, uint64_t *p, uint32_t c){return -1;}
int drmSyncobjTimelineWait(int fd, uint32_t *h, uint64_t *p, unsigned c, int64_t t, uint32_t f, uint32_t *fi){return -1;}
int drmGetDevices2(uint32_t f, void **d, int n){return -1;}
void drmFreeDevices(void **d, int n){}
int drmSyncobjWait(int fd, uint32_t *h, unsigned c, int64_t t, uint32_t f, uint32_t *fi){return -1;}
int drmGetCap(int fd, uint64_t c, uint64_t *v){return -1;}
int drmSyncobjTimelineSignal(int fd, const uint32_t *h, uint64_t *p, uint32_t c){return -1;}
int drmSyncobjSignal(int fd, const uint32_t *h, uint32_t c){return -1;}
int drmSyncobjReset(int fd, const uint32_t *h, uint32_t c){return -1;}
int drmSyncobjImportSyncFile(int fd, uint32_t h, int sf){return -1;}
int drmSyncobjHandleToFD(int fd, uint32_t h, int *fdo){return -1;}
void drmFreeDevice(void **d){}
STUBEOF
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang \
            -shared -fPIC -o /tmp/libdrm.so /tmp/drm_stub.c
          sudo cp /tmp/libdrm.so $SYSROOT/usr/lib/aarch64-linux-android/

          # pkg-config
          mkdir -p $HOME/cross-pkgconfig
          printf 'prefix=%s\nlibdir=${prefix}/usr/lib/aarch64-linux-android\nincludedir=${prefix}/usr/include\nName: libdrm\nDescription: DRM\nVersion: 2.4.113\nLibs: -L${libdir} -ldrm\nCflags: -I${includedir}/libdrm\n' "$SYSROOT" > $HOME/cross-pkgconfig/libdrm.pc
          echo "PKG_CONFIG_LIBDIR=$HOME/cross-pkgconfig:/usr/lib/pkgconfig" >> $GITHUB_ENV

      - name: Build
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export PATH=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          echo "Using NDK: $ANDROID_NDK_LATEST_HOME"
          NDK_SYSROOT=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          sed -i "s|/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot|$NDK_SYSROOT|g" .android/aarch64-android.ini
          meson setup build \
            --cross-file .android/aarch64-android.ini \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers= \
            -Dplatforms=android \
            -Dbuildtype=release \
            -Dandroid-stub=true \
            -Dc_args='-D__TERMUX__' \
            -Dcpp_args='-D__TERMUX__'
          ninja -C build src/vulkan/wrapper/libvulkan_wrapper.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          path: build/src/vulkan/wrapper/libvulkan_wrapper.so
